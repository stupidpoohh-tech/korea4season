name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
      - claude/korea-seasonal-map-design-rlw8mk
  workflow_dispatch:

# 같은 브랜치에서 배포가 겹치면 뒤엣것만 남긴다
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 설정 점검
        run: |
          # 이 앱은 Worker 없이 정적 파일만 올린다. main 이 되살아나 있으면
          # 화면 요청마다 Worker 가 깨어나 Workers Free 한도(요청당 CPU 10ms)를
          # 넘기므로, 의도한 변경인지 사람이 보게 여기서 멈춘다.
          if grep -q '"main"' wrangler.jsonc; then
            echo "::error::wrangler.jsonc 에 main 이 있습니다 — 정적 전용 배포가 아닙니다."
            echo "의도한 것이라면 이 점검을 함께 고쳐 주세요."
            exit 1
          fi

      - name: 타입 검사
        run: npm run typecheck

      - name: 린트
        run: npx eslint .

      # 배포된 화면이 어느 커밋인지 스스로 말할 수 있어야 한다.
      # 이 저장소 안에서는 운영 주소를 열 수 없으므로, 화면이 자기 신원을 들고 있어야
      # 사람이 그것을 그대로 옮겨 줄 수 있다 (?debug=1 진단 패널).
      - name: 빌드 및 배포
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}
          NEXT_PUBLIC_BUILD_AT: ${{ github.event.head_commit.timestamp || github.run_started_at }}
          # og:image 는 절대 주소여야 한다 — 카카오톡은 상대 경로를 무시한다.
          # 도메인을 바꾸면 저장소 변수(Settings → Secrets and variables → Actions
          # → Variables)에 SITE_URL 을 두면 되고, 없으면 아래 기본값을 쓴다.
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://korea4season.stupidpoohh.workers.dev' }}
